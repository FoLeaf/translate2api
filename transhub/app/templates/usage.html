{% extends "base.html" %}
{% block content %}
<h1>使用记录</h1>
<div class="card">
  <div class="row" style="margin-bottom:10px">
    <select id="limit" onchange="load()">
      <option value="50">最近 50 条</option>
      <option value="100" selected>最近 100 条</option>
      <option value="300">最近 300 条</option>
    </select>
    <button class="small" onclick="load()">刷新</button>
  </div>
  <div style="overflow-x:auto">
  <table>
    <tr><th>时间</th><th>服务商</th><th>端点</th><th>结果</th><th>码</th><th class="num">字符</th><th class="num">耗时</th><th>来源 IP</th><th>备注</th></tr>
    <tbody id="rows"></tbody>
  </table>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
async function load() {
  const limit = document.getElementById("limit").value;
  const d = await api(`/admin/api/usage?limit=${limit}`);
  if (!d.ok) return;
  document.getElementById("rows").innerHTML = d.rows.map(r => `
    <tr>
      <td class="small">${fmtTime(r.ts)}</td>
      <td>${esc(r.provider)}</td>
      <td class="small">${esc(r.endpoint)}</td>
      <td>${r.ok ? '<span class="badge ok">OK</span>' : '<span class="badge bad">失败</span>'}</td>
      <td class="small">${esc(r.code ?? "-")}</td>
      <td class="num small">${r.chars ?? "-"}</td>
      <td class="num small">${r.ms != null ? (r.ms / 1000).toFixed(1) + "s" : "-"}</td>
      <td class="small">${esc(r.ip || "")}</td>
      <td class="small muted">${esc(r.msg || "")}</td>
    </tr>`).join("") || `<tr><td colspan="9" class="muted">暂无记录</td></tr>`;
}
load();
</script>
{% endblock %}
