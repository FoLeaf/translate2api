{% extends "base.html" %}
{% block content %}
<h1>仪表盘</h1>
<div id="providers"></div>

<div class="card">
  <h2>ReadFrog（陪读蛙）接入配置</h2>
  <div id="keynote"></div>
  <p class="muted small">
    选项 → API 服务商 → 新增服务商。豆包选「纯翻译服务商 DeepLX」，B站选「OpenAI 兼容(自定义)」。
  </p>
  <div id="urls"></div>
</div>

<div class="card">
  <h2>最近 24 小时用量</h2>
  <div id="stats" class="muted">加载中…</div>
</div>
{% endblock %}

{% block script %}
<script>
async function load() {
  const d = await api("/admin/api/overview");
  if (!d.ok) return;

  // 服务商卡片
  const box = document.getElementById("providers");
  box.innerHTML = d.providers.map(p => `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <h2 style="margin:0">${esc(p.name)} ${statusBadge(p.status && p.status.ok)}</h2>
          <div class="muted small">${esc(p.desc || "")}</div>
        </div>
        <a href="/admin/providers">管理 →</a>
      </div>
      <div class="small" style="margin-top:8px">${esc(p.status ? p.status.detail : "")}</div>
    </div>`).join("");

  // Key 提示
  const kn = document.getElementById("keynote");
  if (d.key_required) {
    kn.innerHTML = `<div class="alert warn">网关已启用 API Key 鉴权（共 ${d.key_count} 个）。
      下方配置里的 API Key 请到「<a href="/admin/keys">API Key</a>」页创建并复制。</div>`;
  } else {
    kn.innerHTML = `<div class="alert bad">当前网关完全开放（未创建任何 API Key）。
      任何知道地址的人都能消耗你的豆包账号额度，建议立即到「<a href="/admin/keys">API Key</a>」页创建。</div>`;
  }

  // 接入配置
  document.getElementById("urls").innerHTML = `
    <label class="f">豆包翻译（DeepLX 服务商）</label>
    <div class="codeblock"><code>${esc(d.base_urls.doubao_deeplx)}</code>
      <button onclick="copyText('${esc(d.base_urls.doubao_deeplx)}')">复制</button></div>
    <label class="f">B站 Index-Translate（OpenAI 兼容服务商，模型 Index-Translate-35B-A3B）</label>
    <div class="codeblock"><code>${esc(d.base_urls.bilibili_openai)}</code>
      <button onclick="copyText('${esc(d.base_urls.bilibili_openai)}')">复制</button></div>
    <p class="muted small">B站线路已由云端自动剥离 Origin 请求头，浏览器侧无需任何补丁/扩展。</p>`;

  // 用量
  const st = document.getElementById("stats");
  const keys = Object.keys(d.stats || {});
  if (!keys.length) { st.textContent = "暂无数据"; return; }
  st.className = "statline";
  st.innerHTML = keys.map(k => {
    const s = d.stats[k];
    return `<div class="item"><b>${s.cnt}</b><span>${esc(k)} · 24h 请求（成功 ${s.ok}，均 ${(s.avg_ms/1000).toFixed(1)}s）</span></div>`;
  }).join("");
}
load();
</script>
{% endblock %}
