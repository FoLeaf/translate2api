{% extends "base.html" %}
{% block content %}
<h1>API Key</h1>
<div class="card">
  <p class="muted small" style="margin-top:0">
    创建任意一个 Key 后，网关（/doubao、/bilibili）即要求鉴权；删除全部 Key 后恢复开放。
    客户端以 <code>Authorization: Bearer &lt;key&gt;</code> 携带（ReadFrog 的 DeepLX 与 OpenAI 兼容服务商均可填）。
  </p>
  <div class="row">
    <input type="text" id="kname" placeholder="Key 备注（如：我的电脑）" style="max-width:280px">
    <button class="primary" onclick="createKey()">创建 API Key</button>
  </div>
  <div id="newkey"></div>
</div>
<div class="card">
  <h2>已有 Key</h2>
  <table>
    <tr><th>备注</th><th>前缀</th><th>状态</th><th>创建时间</th><th>最近使用</th><th></th></tr>
    <tbody id="klist"></tbody>
  </table>
</div>
{% endblock %}

{% block script %}
<script>
async function load() {
  const d = await api("/admin/api/keys");
  if (!d.ok) return;
  document.getElementById("klist").innerHTML = d.keys.map(k => `
    <tr>
      <td>${esc(k.name)}</td>
      <td><code>${esc(k.prefix)}</code></td>
      <td>${k.enabled ? '<span class="badge ok">启用</span>' : '<span class="badge muted">停用</span>'}</td>
      <td class="small">${fmtTime(k.created_at)}</td>
      <td class="small">${fmtTime(k.last_used_at)}</td>
      <td class="row" style="gap:6px">
        <button class="small" onclick="toggleKey(${k.id})">${k.enabled ? "停用" : "启用"}</button>
        <button class="small danger" onclick="delKey(${k.id})">删除</button>
      </td>
    </tr>`).join("") || `<tr><td colspan="6" class="muted">暂无 Key（网关当前完全开放）</td></tr>`;
}

async function createKey() {
  const name = document.getElementById("kname").value.trim() || "默认";
  const r = await api("/admin/api/keys", { method: "POST", body: { name } });
  const box = document.getElementById("newkey");
  if (!r.ok) { toast(r.detail || "创建失败"); return; }
  box.innerHTML = `
    <div class="alert ok">
      Key 已创建，<b>仅此一次展示</b>，请立即复制保存：<br>
      <div class="codeblock"><code>${esc(r.key)}</code>
        <button onclick="copyText('${esc(r.key)}')">复制</button></div>
    </div>`;
  document.getElementById("kname").value = "";
  load();
}

async function toggleKey(id) {
  await api(`/admin/api/keys/${id}/toggle`, { method: "POST" });
  load();
}
async function delKey(id) {
  if (!confirm("确定删除该 Key？使用它的客户端会立即失效。")) return;
  await api(`/admin/api/keys/${id}`, { method: "DELETE" });
  load();
}
load();
</script>
{% endblock %}
