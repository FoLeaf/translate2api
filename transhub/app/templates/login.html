<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - {{ app_title }}</title>
<link rel="stylesheet" href="/admin/static/app.css">
</head>
<body>
<div class="login-box">
  <h1>{{ app_title }}</h1>
  <div class="sub">自托管翻译网关 · 后台管理</div>
  <input type="password" id="pw" placeholder="管理员密码" autofocus>
  <button class="primary" id="btn" onclick="doLogin()">登 录</button>
  <div id="err" class="muted small" style="margin-top:12px;text-align:center"></div>
</div>
<script src="/admin/static/app.js"></script>
<script>
async function doLogin() {
  const btn = document.getElementById("btn");
  const pw = document.getElementById("pw");
  const err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "登录中…";
  const r = await fetch("/admin/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Requested-With": "fetch" },
    body: JSON.stringify({ password: pw.value })
  }).then(r => r.json()).catch(() => ({ ok: false, detail: "网络错误" }));
  if (r.ok) { location.href = "/admin"; return; }
  err.textContent = r.detail || "登录失败";
  btn.disabled = false; btn.textContent = "登 录";
}
document.getElementById("pw").addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});
</script>
</body>
</html>
