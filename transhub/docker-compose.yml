services:
  transhub:
    build: .
    container_name: transhub
    restart: unless-stopped
    ports:
      - "8300:8000"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      # 仅首次启动生效：设置管理员初始密码；留空则自动生成随机密码
      # （打印在 docker logs 里，并写入 data/initial_admin_password.txt）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    shm_size: 256m
    mem_limit: 1200m
