services:
  transhub-go:
    build: .
    container_name: transhub-go
    restart: unless-stopped
    ports:
      - "8301:8000"
    volumes:
      # 自有数据目录（transhub.db 为旧 Python 库存档）
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # 豆包上游间歇停滞治理：45 秒读超时；上游错误不重试直接返回客户端
      # 入口排队参数（默认）：等待 12 秒 / 全局 48 / 单 Key 12
      - TH_DOUBAO_QUEUE_WAIT=12
      - TH_DOUBAO_QUEUE_CAP=48
      - TH_DOUBAO_KEY_CAP=12
      - TH_DOUBAO_TIMEOUT=45
      - TH_DOUBAO_BATCH_MAX=16
      - TH_DOUBAO_UPSTREAM_CONC=2
      - TH_BILIBILI_UPSTREAM_CONC=32
      - TH_TRUSTED_PROXIES=127.0.0.1
    shm_size: 256m
    mem_limit: 700m
